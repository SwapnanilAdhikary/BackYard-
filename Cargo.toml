[workspace]
members = [
    "backyard-core",
    "backyard-redis",
    "backyard-sqlite",
    "backyard-macros",
    "backyard",
]
# Note: backyard directory contains backyard-queue crate
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/backyard"
homepage = "https://github.com/user/backyard"
documentation = "https://docs.rs/backyard"
authors = ["Backyard Contributors"]

[workspace.dependencies]
# Path + version: `path` is used locally; `version` is required for `cargo publish`.
backyard-core = { path = "backyard-core", version = "0.1.0" }
backyard-macros = { path = "backyard-macros", version = "0.1.0" }
backyard-redis = { path = "backyard-redis", version = "0.1.0" }
backyard-sqlite = { path = "backyard-sqlite", version = "0.1.0" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"
anyhow = "1"

chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

inventory = "0.3"

uuid = { version = "1", features = ["v4", "serde"] }

fred = { version = "9", features = ["tokio-rustls"] }

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }

axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

cron = "0.12"

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

async-trait = "0.1"
rand = "0.8"
futures = "0.3"
